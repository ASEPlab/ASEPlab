# ====================================
# Basic Site Info
# ====================================
title: "ASePlab – The Choi Lab"
email: "hchoi4@uwyo.edu"
description: >
  Advanced Separation & Purification Laboratory (ASeP Lab)
  at the University of Wyoming. 
  Research in sustainability,
  critical mineral recovery, adsorption, chromatography,
  and next-generation separation processes.

url: "https://aseplab.github.io"
baseurl: ""

# ====================================
# Build Settings
# ====================================
include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# ====================================
# Markdown / Kramdown Settings
# ====================================
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

# ====================================
# Plugins (safe for GitHub Pages)
# ====================================
plugins:
  - jekyll-feed
  - jekyll-sitemap

# ====================================
# Exclusions
# ====================================
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
